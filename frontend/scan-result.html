<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queue — SYSU International</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg: #08080a;
        --surface: #0e0e10;
        --surface2: #16161a;
        --text: #f0f0f0;
        --text-muted: #888;
        --green: #4cd478;
        --green-dim: rgba(76, 212, 120, 0.15);
        --green-border: rgba(76, 212, 120, 0.35);
        --red: #e63946;
        --red-dim: rgba(230, 57, 70, 0.12);
        --red-border: rgba(230, 57, 70, 0.35);
        --border: rgba(255,255,255,0.07);
      }

      html, body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: 'DM Sans', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .logo {
        font-family: 'Syne', sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--text-muted);
        margin-bottom: 2.5rem;
        text-transform: uppercase;
      }
      .logo span { color: var(--red); }

      /* ── Card ─── */
      .card {
        width: min(360px, 92vw);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2.5rem 2rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }

      /* ── States ─── */
      .state { display: none; flex-direction: column; align-items: center; text-align: center; width: 100%; }
      .state.active { display: flex; }

      /* ── Scanning ─── */
      .scan-icon {
        width: 72px; height: 72px;
        border-radius: 50%;
        border: 2px solid var(--border);
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 1.5rem;
        animation: pulse-border 1.5s ease-in-out infinite;
      }
      .scan-icon svg { width: 32px; height: 32px; opacity: 0.6; }
      @keyframes pulse-border {
        0%, 100% { border-color: var(--border); }
        50% { border-color: rgba(255,255,255,0.2); }
      }
      .state-label {
        font-size: 1.15rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 0.4rem;
      }
      .state-sub {
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      /* ── Success ─── */
      .success-icon {
        width: 80px; height: 80px;
        border-radius: 50%;
        background: var(--green-dim);
        border: 2px solid var(--green-border);
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 1.5rem;
        animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      @keyframes pop-in {
        0% { transform: scale(0.4); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      .success-icon svg { width: 40px; height: 40px; stroke: var(--green); stroke-width: 2.5; fill: none; }
      .success-icon svg path { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw-check 0.5s 0.3s ease-out forwards; }
      @keyframes draw-check { to { stroke-dashoffset: 0; } }

      .pulse-ring {
        position: absolute;
        width: 80px; height: 80px;
        border-radius: 50%;
        border: 2px solid var(--green);
        animation: ring-expand 0.8s 0.1s ease-out forwards;
        opacity: 0;
      }
      @keyframes ring-expand {
        0% { transform: scale(1); opacity: 0.7; }
        100% { transform: scale(2.2); opacity: 0; }
      }

      .success-title { font-size: 1.4rem; font-weight: 700; color: var(--green); margin-bottom: 0.5rem; }
      .success-sub { font-size: 0.88rem; color: var(--text-muted); line-height: 1.5; }

      /* ── Error ─── */
      .error-icon {
        width: 80px; height: 80px;
        border-radius: 50%;
        background: var(--red-dim);
        border: 2px solid var(--red-border);
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 1.5rem;
        animation: pop-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      .error-icon svg { width: 36px; height: 36px; stroke: var(--red); stroke-width: 2.5; fill: none; }
      .error-title { font-size: 1.2rem; font-weight: 700; color: var(--red); margin-bottom: 0.5rem; }
      .error-msg { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.5; }
      .try-again-btn {
        background: var(--red-dim);
        border: 1px solid var(--red-border);
        color: var(--red);
        padding: 0.7rem 1.6rem;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        font-family: inherit;
        width: 100%;
        max-width: 200px;
      }
      .try-again-btn:hover { background: rgba(230,57,70,0.2); }
      .try-again-btn:active { transform: scale(0.97); }

      /* ── Token display ─── */
      .token-tag {
        display: inline-block;
        font-family: 'Courier New', monospace;
        font-size: 0.78rem;
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.2rem 0.6rem;
        color: var(--text-muted);
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="logo">SYSU <span>Queue</span></div>

    <div class="card">
      <!-- Scanning state -->
      <div id="state-scanning" class="state active">
        <div class="scan-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
            <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
            <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
            <line x1="7" y1="12" x2="17" y2="12"/>
          </svg>
        </div>
        <div class="state-label">Verifying QR Code…</div>
        <div class="state-sub">Please hold your phone steady</div>
      </div>

      <!-- Success state -->
      <div id="state-success" class="state">
        <div style="position:relative; display:flex; align-items:center; justify-content:center; margin-bottom:1.5rem;">
          <div class="pulse-ring" id="pulse"></div>
          <div class="success-icon">
            <svg viewBox="0 0 24 24">
              <path d="M20 6L9 17l-5-5"/>
            </svg>
          </div>
        </div>
        <div class="success-title">You're in the queue!</div>
        <div class="success-sub">The yard team has received your spot.<br>Please proceed to the loading zone.</div>
        <div id="verified-token" class="token-tag"></div>
      </div>

      <!-- Error state -->
      <div id="state-error" class="state">
        <div class="error-icon">
          <svg viewBox="0 0 24 24" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </div>
        <div class="error-title" id="err-title">Verification Failed</div>
        <div class="error-msg" id="err-msg">This QR code could not be verified.</div>
        <button class="try-again-btn" id="retryBtn">Scan Again</button>
      </div>
    </div>

    <script>
      const BACKEND_URL = 'https://sysu-app-production.up.railway.app/api/qr';
      const token = new URLSearchParams(window.location.search).get('token');

      const stateScanning = document.getElementById('state-scanning');
      const stateSuccess  = document.getElementById('state-success');
      const stateError    = document.getElementById('state-error');
      const errTitle      = document.getElementById('err-title');
      const errMsg        = document.getElementById('err-msg');
      const verifiedToken = document.getElementById('verified-token');
      const pulse         = document.getElementById('pulse');

      if (!token) {
        showError('No Token', 'No token found in URL. Please scan the QR code again.');
        return;
      }

      function switchTo(id) {
        [stateScanning, stateSuccess, stateError].forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
      }

      function showSuccess() {
        verifiedToken.textContent = token;
        // pulse animation
        if (pulse) { pulse.style.display = 'block'; }
        switchTo('state-success');
        // auto-dismiss after 5 seconds (driver can just close the page)
      }

      function showError(title, msg) {
        errTitle.textContent = title || 'Verification Failed';
        errMsg.textContent  = msg || 'An unexpected error occurred.';
        switchTo('state-error');
      }

      document.getElementById('retryBtn').addEventListener('click', () => {
        // Re-verify the same token
        switchTo('state-scanning');
        verifyToken();
      });

      async function verifyToken() {
        try {
          const res = await fetch(BACKEND_URL + '/verify?token=' + encodeURIComponent(token), {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
          });

          if (res.ok) {
            showSuccess();
          } else if (res.status === 410) {
            const data = await res.json().catch(() => ({}));
            showError('QR Expired', data.message || 'This QR has expired. Please get a new one from the yard TV.');
          } else if (res.status === 404) {
            showError('Invalid QR', 'This QR code is not recognized. Please scan the QR from the yard TV.');
          } else {
            const data = await res.json().catch(() => ({}));
            showError('Verification Failed', data.message || 'Could not verify this QR code. Please try again.');
          }
        } catch (e) {
          showError('Connection Error', 'Cannot reach the server. Make sure you have internet connection and try again.');
        }
      }

      verifyToken();
    </script>
  </body>
</html>
